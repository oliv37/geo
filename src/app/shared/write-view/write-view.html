<div class="min-h-dvh flex flex-col p-4 gap-3">
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events -->
  <div
    class="flex-1 relative min-h-60 map-container"
    tabindex="-1"
    #mapContainer
  >
    <ng-container *ngComponentOutlet="Map()"></ng-container>
  </div>

  <div
    [class]="
    'flex flex-wrap justify-center items-center gap-3 ' + 
    'min-h-8 text-lg sm:text-xl italic'"
  >
    @let _fieldIdx = state().fieldIdx; @for (hint of hints(); track $index) {
    <span class="wrap-anywhere" [class.font-bold]="$index === _fieldIdx">
      {{ hint }}
    </span>
    }
  </div>

  <div class="flex justify-center items-center">
    <div class="relative">
      <input
        type="text"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        [class]="
        'w-full max-w-sm outline-none ' +
        'text-xl sm:text-3xl text-center leading-normal '
      "
        [value]="state().text"
        (input)="setText($any($event.target).value)"
        #inputEl
      />
      <div class="w-full h-1.5 border border-black rounded-lg">
        <div
          class="h-full bg-blue-700 transition-all duration-500"
          [style.width.%]="progressPercent()"
        ></div>
      </div>
    </div>
  </div>
</div>
