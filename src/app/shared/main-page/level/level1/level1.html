<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events -->
<div
  class="flex-1 w-full relative min-h-60 map-container clickable"
  tabindex="-1"
  (click)="onMapClick($event)"
  #mapContainer
>
  <ng-container *ngComponentOutlet="Map()"></ng-container>
</div>

<div class="min-h-31 flex flex-col justify-end items-center gap-3">
  <div
    class="flex flex-wrap justify-center items-center gap-3 text-xl sm:text-2xl"
  >
    @if (item(); as _item) { @for (field of fields(); track field) {
    <span class="wrap-anywhere"> {{ _item[field] }} </span>
    }}
  </div>

  <div class="flex justify-center items-center gap-5">
    <button type="button" (click)="previousItem()">
      <geo-caret-left-fill-icon />
    </button>
    <button
      type="button"
      [class]="'relative overflow-hidden flex items-center justify-center ' + 
      'px-2 py-2 border-2 border-red rounded-full shadow-md shadow-gray-600'"
      (click)="togglePlayStopState()"
    >
      @if (playStopState() === 'play') {
      <div #playOverlay class="absolute top-0 left-0 h-full bg-blue-600"></div>
      <geo-stop-icon class="z-10" />
      } @else {
      <geo-play-icon class="z-10" />
      }
    </button>
    <button type="button" (click)="nextItem()">
      <geo-caret-right-fill-icon />
    </button>
  </div>

  <geo-level-progress
    class="w-full max-w-sm"
    [current]="itemIndex() + 1"
    [total]="data().length"
  />
</div>
