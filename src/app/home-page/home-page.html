<div class="flex flex-col gap-8 py-3 px-2">
  @for (link of links; track $index) {
  <a
    [routerLink]="link.url"
    class="flex w-full items-center justify-between px-2 py-4 border-b border-black/10 hover:text-black text-gray-700 tracking-wide hover:border-black/40 transition-all duration-700 ease-out"
    >{{link.label}}</a
  >
  }
</div>
